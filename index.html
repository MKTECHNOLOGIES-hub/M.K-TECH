<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.K TECH | Mobile Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- FIREBASE SDKs (Compat Version for simple HTML single-file use) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .app-screen {
            display: none;
        }
        .app-screen.active {
            display: block;
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen max-w-md mx-auto bg-slate-50 relative pb-20 border-x border-slate-200/60 shadow-sm">

    <!-- APP TOP HEADER -->
    <header class="px-5 pt-5 pb-3 flex items-center justify-between bg-slate-50/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-slate-900 text-white font-black flex items-center justify-center text-xs tracking-tighter">
                MK
            </div>
            <h1 class="text-base font-bold text-slate-900 tracking-tight">M.K TECH</h1>
        </div>
        <button onclick="switchTab('cart')" class="relative p-2 rounded-xl text-slate-700 hover:bg-slate-200/50 transition">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            <span id="cartCountBadge" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full bg-slate-900"></span>
        </button>
    </header>

    <!-- ================= SCREENS ================= -->

    <!-- 1. HOME SCREEN -->
    <section id="screen-home" class="app-screen active px-5 py-4 space-y-5">
        <!-- Hero Banner -->
        <div class="w-full bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Featured Store</span>
            <h2 class="text-xl font-extrabold mt-1">Upgrade Your Tech Game ⚡</h2>
            <p class="text-xs text-slate-300 mt-1 max-w-[200px]">Smartwatches, Audio Gear & Action Cameras.</p>
            <button onclick="switchTab('products')" class="mt-4 px-4 py-2 bg-white text-slate-900 rounded-xl text-xs font-bold shadow-md hover:bg-slate-100 transition">
                Explore Shop
            </button>
        </div>

        <!-- Trending Products Horizontal -->
        <div>
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Trending Now</h3>
                <button onclick="switchTab('products')" class="text-xs font-semibold text-slate-900">View All</button>
            </div>
            <div id="homeTrendingGrid" class="grid grid-cols-2 gap-3">
                <!-- Loaded from Firestore -->
            </div>
        </div>
    </section>

    <!-- 2. PRODUCTS / SHOP SCREEN -->
    <section id="screen-products" class="app-screen space-y-3">
        <!-- SEARCH BAR -->
        <div class="px-5 pt-3">
            <div class="flex items-center gap-2">
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search gadgets..." 
                        class="w-full bg-slate-100/90 text-xs text-slate-800 placeholder-slate-400 pl-10 pr-4 py-3 rounded-2xl focus:outline-none focus:ring-1 focus:ring-slate-300 transition">
                </div>
            </div>
        </div>

        <!-- CATEGORY PILLS -->
        <div class="px-5 py-2 flex items-center gap-2 overflow-x-auto hide-scrollbar text-xs font-medium">
            <button onclick="filterCategory('all', this)" class="cat-pill active bg-slate-900 text-white px-4 py-2 rounded-xl font-semibold whitespace-nowrap transition">All</button>
            <button onclick="filterCategory('watches', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Watches</button>
            <button onclick="filterCategory('earbuds', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Earbuds</button>
            <button onclick="filterCategory('cameras', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Cameras</button>
            <button onclick="filterCategory('gaming', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Gaming</button>
        </div>

        <!-- PRODUCT GRID -->
        <main class="px-5 pb-8">
            <div id="productGrid" class="grid grid-cols-2 gap-3.5">
                <!-- Loaded from Firestore -->
            </div>
        </main>
    </section>

    <!-- 3. CART SCREEN -->
    <section id="screen-cart" class="app-screen px-5 py-4 space-y-4">
        <h2 class="text-base font-bold text-slate-900">Shopping Cart</h2>
        <div id="cartItemsList" class="space-y-3 min-h-[140px]">
            <!-- Dynamic Cart Items -->
        </div>

        <!-- Customer Checkout Info Form (Professional Layout) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-3">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="user-check" class="w-4 h-4 text-slate-600"></i> Contact Details
            </h3>
            <input type="text" id="custName" placeholder="Full Name (e.g., Arain)" class="w-full bg-slate-100 text-xs p-3 rounded-xl focus:outline-none">
            <input type="text" id="custPhone" placeholder="Phone Number (e.g., 03001234567)" class="w-full bg-slate-100 text-xs p-3 rounded-xl focus:outline-none">
            <input type="text" id="custWhatsapp" placeholder="WhatsApp Number" class="w-full bg-slate-100 text-xs p-3 rounded-xl focus:outline-none">
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-3">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="map-pin" class="w-4 h-4 text-slate-600"></i> Address Details
            </h3>
            
            <!-- Custom Select City Trigger Button -->
            <div onclick="openCityModal()" class="w-full bg-slate-100 text-xs p-3 rounded-xl flex items-center justify-between cursor-pointer text-slate-700">
                <span id="selectedCityText">Select City...</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
            </div>

            <input type="text" id="custArea" placeholder="Sector / Block / Area Name" class="w-full bg-slate-100 text-xs p-3 rounded-xl focus:outline-none">
            <input type="text" id="custAddress" placeholder="Full Street Address" class="w-full bg-slate-100 text-xs p-3 rounded-xl focus:outline-none">
            <input type="text" id="custLandmark" placeholder="Mashoor Jagah / Landmark (Optional)" class="w-full bg-slate-100 text-xs p-3 rounded-xl focus:outline-none">
        </div>

        <!-- Payment Method Section (Cash on Delivery) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-2">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Payment Method</h3>
            <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer">
                <input type="radio" name="paymentMethod" value="COD" checked class="accent-slate-900">
                <div class="text-xs">
                    <p class="font-bold text-slate-900">Cash on Delivery (COD)</p>
                    <p class="text-[10px] text-slate-500">Pay securely when your package arrives.</p>
                </div>
            </label>
        </div>

        <!-- Cart Summary & Checkout -->
        <div class="border-t border-slate-200 pt-3 space-y-3 bg-white p-4 rounded-2xl shadow-xs">
            <div class="flex justify-between text-xs font-semibold">
                <span class="text-slate-500">Subtotal:</span>
                <span id="cartTotalText" class="text-slate-900 font-bold">Rs. 0</span>
            </div>
            <button onclick="submitOrderToFirestore()" class="w-full py-3.5 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800 transition flex items-center justify-center gap-2 shadow-md">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Place Order (Cash on Delivery)
            </button>
        </div>
    </section>

    <!-- 4. PROFILE SCREEN -->
    <section id="screen-profile" class="app-screen px-5 py-6 space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 space-y-1">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Anonymous User UID</span>
            <p id="userUidDisplay" class="text-xs font-mono font-bold text-slate-900 truncate">Loading...</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-100 divide-y divide-slate-100 text-xs font-semibold">
            <button onclick="openSubPage('faq')" class="w-full p-4 flex items-center justify-between hover:bg-slate-50 transition">
                <span class="flex items-center gap-2"><i data-lucide="help-circle" class="w-4 h-4 text-slate-600"></i> FAQ</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
            <button onclick="openSubPage('feedback')" class="w-full p-4 flex items-center justify-between hover:bg-slate-50 transition">
                <span class="flex items-center gap-2"><i data-lucide="message-square" class="w-4 h-4 text-slate-600"></i> Feedback</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
            <button onclick="openSubPage('terms')" class="w-full p-4 flex items-center justify-between hover:bg-slate-50 transition">
                <span class="flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-slate-600"></i> Terms & Conditions</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
            <button onclick="openSubPage('about')" class="w-full p-4 flex items-center justify-between hover:bg-slate-50 transition">
                <span class="flex items-center gap-2"><i data-lucide="info" class="w-4 h-4 text-slate-600"></i> About</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
        </div>
    </section>

    <!-- ================= SUB-PAGES MODAL (FAQ, Feedback, Terms, About) ================= -->
    <div id="subPageModal" class="fixed inset-0 bg-white z-50 hidden flex flex-col">
        <div class="px-5 py-4 flex items-center justify-between border-b border-slate-100 bg-white sticky top-0">
            <button onclick="closeSubPage()" class="p-2 -ml-2 text-slate-700 flex items-center gap-1 text-xs font-semibold">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Back
            </button>
            <h2 id="subPageTitle" class="text-xs font-bold text-slate-900 uppercase tracking-wider"></h2>
            <div class="w-8"></div>
        </div>
        <div id="subPageContent" class="flex-1 overflow-y-auto p-5 text-xs text-slate-600 space-y-3 leading-relaxed">
            <!-- Dynamic content -->
        </div>
    </div>

    <!-- ================= PRODUCT DETAIL VIEW ================= -->
    <div id="productDetailView" class="fixed inset-0 bg-white z-50 hidden overflow-y-auto">
        <div class="sticky top-0 bg-white/90 backdrop-blur-md px-5 py-4 flex items-center justify-between border-b border-slate-100 z-10">
            <button onclick="closeProductDetail()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 text-slate-700">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Product Details</span>
            <button onclick="switchTab('cart'); closeProductDetail();" class="p-2 -mr-2 text-slate-700">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="px-5 py-4 space-y-4 max-w-md mx-auto pb-24">
            <div class="w-full aspect-square bg-slate-100 rounded-3xl overflow-hidden shadow-inner">
                <img id="d-image" src="" class="w-full h-full object-cover">
            </div>
            <div class="space-y-1">
                <span id="d-category" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg"></span>
                <h2 id="d-title" class="text-xl font-extrabold text-slate-900 pt-1"></h2>
                <p id="d-price" class="text-lg font-bold text-slate-900"></p>
            </div>
            <hr class="border-slate-100">
            <div>
                <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Description</h4>
                <p id="d-desc" class="text-xs text-slate-500 leading-relaxed"></p>
            </div>
        </div>

        <div class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white/95 backdrop-blur-md p-4 border-t border-slate-100">
            <button id="d-addToCartBtn" class="w-full py-3.5 bg-slate-900 text-white font-bold text-xs rounded-2xl shadow-lg hover:bg-slate-800 transition flex items-center justify-center gap-2">
                <i data-lucide="shopping-cart" class="w-4 h-4"></i> Add to Cart
            </button>
        </div>
    </div>

    <!-- ================= CITY SELECTION MODAL ================= -->
    <div id="cityModal" class="fixed inset-0 bg-white z-50 hidden flex flex-col">
        <div class="px-5 py-4 flex items-center justify-between border-b border-slate-100 bg-white sticky top-0">
            <button onclick="closeCityModal()" class="p-2 -ml-2 text-slate-700">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Select City and Area</h2>
            <div class="w-5"></div>
        </div>
        <div class="px-5 py-3 bg-slate-50 border-b border-slate-100">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="citySearchInput" oninput="filterCityList()" placeholder="Search..." 
                    class="w-full bg-white text-xs text-slate-800 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none">
            </div>
        </div>
        <div id="cityListContainer" class="flex-1 overflow-y-auto px-5 divide-y divide-slate-100 text-xs">
            <!-- Dynamic Cities List -->
        </div>
    </div>

    <!-- ================= BOTTOM NAVIGATION BAR ================= -->
    <nav class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-200/80 px-6 py-2.5 flex items-center justify-between z-40">
        <button onclick="switchTab('home')" class="nav-btn active flex flex-col items-center gap-1 text-slate-900" data-tab="home">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="switchTab('products')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900" data-tab="products">
            <i data-lucide="grid" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Products</span>
        </button>
        <button onclick="switchTab('cart')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900 relative" data-tab="cart">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Cart</span>
        </button>
        <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900" data-tab="profile">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Profile</span>
        </button>
    </nav>

    <!-- ================= JAVASCRIPT & FIREBASE LOGIC ================= -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAVgOscvlM0tcLmkAsKBCciqkC5O3AAIOU",
          authDomain: "mk-tech-3d536.firebaseapp.com",
          projectId: "mk-tech-3d536",
          storageBucket: "mk-tech-3d536.firebasestorage.app",
          messagingSenderId: "419394180062",
          appId: "1:419394180062:web:b59e2536800babf657034f",
          measurementId: "G-SF1YS17QXH"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let products = [];
        let cart = [];
        let activeCategory = 'all';

        // Pakistani Cities List for Selector
        const pakistaniCities = [
            "Abbas Pur-Azad kashmir", "Abbottabad-Khyber Pakhtunkhwa", "Abdul Hakim-Punjab", 
            "Ahmed Pur East-Punjab", "Ahmedpur Sial-Punjab", "Akora Khattak-Khyber Pakhtunkhwa", 
            "Ali Pur Chatta-Punjab", "Arifwala-Punjab", "Attock-Punjab", "Badin-Sindh", 
            "Bagh-Azad kashmir", "Bahawalnagar-Punjab", "Bahawalpur-Punjab", "Bannu-Khyber Pakhtunkhwa", 
            "Bhalwal-Punjab", "Bhimber-A.K-Azad kashmir", "Burewala-Punjab", "Chakwal-Punjab", 
            "Charsadda-Khyber Pakhtunkhwa", "Chichawatni-Punjab", "Chiniot-Faisalabad-Punjab", 
            "Chishtian-Punjab", "Dadu-Sindh", "Dera Ghazi Khan-Punjab", "Faisalabad-Punjab", 
            "Gojra-Punjab", "Gujar Khan-Punjab", "Gujranwala-Punjab", "Gujrat-Punjab", 
            "Hafizabad-Punjab", "Haripur-Khyber Pakhtunkhwa", "Hyderabad-Sindh", "Islamabad-Federal", 
            "Jacobabad-Sindh", "Jaranwala-Punjab", "Jhang-Punjab", "Jhelum-Punjab", "Kamoke-Punjab", 
            "Karachi-Sindh", "Kasur-Punjab", "Khanewal-Punjab", "Khushab-Punjab", "Kohat-Khyber Pakhtunkhwa", 
            "Lahore-Punjab", "Larkana-Sindh", "Mandi Bahauddin-Punjab", "Mansehra-Khyber Pakhtunkhwa", 
            "Mardan-Khyber Pakhtunkhwa", "Mianwali-Punjab", "Multan-Punjab", "Murree-Punjab", 
            "Muzaffarabad-Azad kashmir", "Muzaffargarh-Punjab", "Nawabshah-Sindh", "Nowshera-Khyber Pakhtunkhwa", 
            "Okara-Punjab", "Pakpattan-Punjab", "Peshawar-Khyber Pakhtunkhwa", "Quetta-Balochistan", 
            "Rahim Yar Khan-Punjab", "Rawalpindi-Punjab", "Sadiqabad-Punjab", "Sahiwal-Punjab", 
            "Sargodha-Punjab", "Sheikhupura-Punjab", "Sialkot-Punjab", "Sukkur-Sindh", "Vehari-Punjab", "Wah Cantt-Punjab"
        ];
        let selectedCity = "";

        document.addEventListener('DOMContentLoaded', () => {
            // Sign in anonymously to get Firebase UID
            auth.signInAnonymously().then((userCredential) => {
                const uid = userCredential.user.uid;
                document.getElementById('userUidDisplay').innerText = uid;
            }).catch((error) => {
                console.error("Auth error:", error);
                document.getElementById('userUidDisplay').innerText = "Offline / Guest";
            });

            fetchProductsFromFirestore();
            lucide.createIcons();
        });

        function fetchProductsFromFirestore() {
            db.collection("products").get().then((querySnapshot) => {
                products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ firestoreId: doc.id, ...doc.data() });
                });

                renderProducts(products);
                renderHomeTrending();
            }).catch((error) => {
                console.error("Error getting products: ", error);
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${tabId}`).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(b => {
                if (b.dataset.tab === tabId) {
                    b.className = 'nav-btn active flex flex-col items-center gap-1 text-slate-900';
                } else {
                    b.className = 'nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900';
                }
            });
            window.scrollTo(0,0);
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(items.length === 0) {
                grid.innerHTML = `<p class="text-xs text-slate-400 text-center py-8 col-span-2">Loading products...</p>`;
                return;
            }
            items.forEach(p => {
                const card = `
                    <div onclick="openProductDetail(${p.id})" class="cursor-pointer group">
                        <div class="relative w-full aspect-square bg-slate-100 rounded-2xl overflow-hidden mb-2">
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <button onclick="event.stopPropagation(); addToCart(${p.id});" class="absolute bottom-2.5 right-2.5 w-7 h-7 rounded-full bg-white/90 backdrop-blur text-slate-800 flex items-center justify-center shadow-xs hover:bg-slate-900 hover:text-white transition">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <h3 class="text-xs font-semibold text-slate-800 truncate">${p.name}</h3>
                        <p class="text-[11px] font-bold text-slate-900">Rs. ${Number(p.price).toLocaleString()}</p>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });
            lucide.createIcons();
        }

        function renderHomeTrending() {
            const container = document.getElementById('homeTrendingGrid');
            container.innerHTML = '';
            if(products.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4 col-span-2">Loading...</p>`;
                return;
            }
            products.slice(0, 4).forEach(p => {
                const card = `
                    <div onclick="openProductDetail(${p.id})" class="cursor-pointer bg-white p-2.5 rounded-2xl border border-slate-100 shadow-xs">
                        <div class="w-full aspect-square bg-slate-100 rounded-xl overflow-hidden mb-2">
                            <img src="${p.image}" class="w-full h-full object-cover">
                        </div>
                        <h4 class="text-xs font-bold text-slate-800 truncate">${p.name}</h4>
                        <p class="text-[11px] font-semibold text-slate-900">Rs. ${Number(p.price).toLocaleString()}</p>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
            lucide.createIcons();
        }

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(b => {
                b.className = 'cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition';
            });
            btn.className = 'cat-pill active bg-slate-900 text-white px-4 py-2 rounded-xl font-semibold whitespace-nowrap transition';

            const filtered = (cat === 'all') ? products : products.filter(p => p.category === cat);
            renderProducts(filtered);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                (activeCategory === 'all' || p.category === activeCategory) &&
                p.name.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        }

        function openProductDetail(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById('d-image').src = p.image;
            document.getElementById('d-title').innerText = p.name;
            document.getElementById('d-price').innerText = `Rs. ${Number(p.price).toLocaleString()}`;
            document.getElementById('d-category').innerText = p.category;
            document.getElementById('d-desc').innerText = p.description || 'No description available.';

            document.getElementById('d-addToCartBtn').onclick = () => {
                addToCart(p.id);
                closeProductDetail();
                switchTab('cart');
            };

            document.getElementById('productDetailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function closeProductDetail() {
            document.getElementById('productDetailView').classList.add('hidden');
        }

        function openCityModal() {
            document.getElementById('cityModal').classList.remove('hidden');
            renderCityList(pakistaniCities);
            lucide.createIcons();
        }

        function closeCityModal() {
            document.getElementById('cityModal').classList.add('hidden');
        }

        function renderCityList(cities) {
            const container = document.getElementById('cityListContainer');
            container.innerHTML = '';
            cities.forEach(city => {
                const item = `
                    <div onclick="selectCity('${city}')" class="py-3 flex items-center justify-between cursor-pointer hover:bg-slate-50">
                        <span class="text-slate-700">${city}</span>
                        ${selectedCity === city ? '<i data-lucide="check" class="w-4 h-4 text-emerald-600"></i>' : ''}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', item);
            });
            lucide.createIcons();
        }

        function filterCityList() {
            const query = document.getElementById('citySearchInput').value.toLowerCase();
            const filtered = pakistaniCities.filter(c => c.toLowerCase().includes(query));
            renderCityList(filtered);
        }

        function selectCity(city) {
            selectedCity = city;
            document.getElementById('selectedCityText').innerText = city;
            document.getElementById('selectedCityText').className = "text-slate-900 font-bold";
            closeCityModal();
        }

        // Sub-pages handler for FAQ, Feedback, Terms, About
        function openSubPage(type) {
            const titles = {
                faq: 'Frequently Asked Questions',
                feedback: 'Send Feedback',
                terms: 'Terms & Conditions',
                about: 'About M.K TECH'
            };
            const contents = {
                faq: '<p><strong>Q: How can I place an order?</strong><br>A: Simply add items to your cart, fill in your delivery details, and select Cash on Delivery.</p><p><strong>Q: What is delivery time?</strong><br>A: Delivery usually takes 3-5 business days across Pakistan.</p>',
                feedback: '<p>We love hearing from our customers! Reach out to us directly via WhatsApp or email for any support or feedback.</p>',
                terms: '<p>All orders placed on M.K TECH are processed under standard retail policies. Cash on Delivery requires correct recipient phone verification.</p>',
                about: '<p>M.K TECH is your premier online destination for cutting-edge smartwatches, audio gear, and mobile accessories in Pakistan. Powered by secure Firebase infrastructure.</p>'
            };

            document.getElementById('subPageTitle').innerText = titles[type];
            document.getElementById('subPageContent').innerHTML = contents[type];
            document.getElementById('subPageModal').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function closeSubPage() {
            document.getElementById('subPageModal').classList.add('hidden');
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...p, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartCountBadge');
            const container = document.getElementById('cartItemsList');
            let total = 0;

            if (cart.length > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');

            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Your cart is empty</p>`;
            }

            cart.forEach(item => {
                total += item.price * item.qty;
                const html = `
                    <div class="flex items-center justify-between p-3 bg-white rounded-2xl border border-slate-100 shadow-xs text-xs">
                        <div class="flex items-center gap-3">
                            <img src="${item.image}" class="w-10 h-10 rounded-xl object-cover">
                            <div>
                                <p class="font-bold text-slate-800">${item.name}</p>
                                <p class="text-[10px] text-slate-400">Rs. ${Number(item.price).toLocaleString()} x ${item.qty}</p>
                            </div>
                        </div>
                        <span class="font-bold text-slate-900">Rs. ${(item.price * item.qty).toLocaleString()}</span>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            document.getElementById('cartTotalText').innerText = `Rs. ${total.toLocaleString()}`;
        }

        function submitOrderToFirestore() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const whatsapp = document.getElementById('custWhatsapp').value.trim();
            const area = document.getElementById('custArea').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const landmark = document.getElementById('custLandmark').value.trim();

            if(!name || !phone || !selectedCity || !address) {
                alert("Please fill in Name, Phone, City, and Full Address!");
                return;
            }

            const orderId = "MK-" + Math.floor(100000 + Math.random() * 900000);
            
            const orderPayload = {
                orderId: orderId,
                createdAt: new Date().toISOString(),
                totalAmount: cart.reduce((acc, i) => acc + (i.price * i.qty), 0),
                status: 'pending',
                paymentMethod: 'Cash on Delivery (COD)',
                items: cart.map(i => ({
                    id: i.id,
                    name: i.name,
                    price: i.price,
                    qty: i.qty
                })),
                customerInfo: {
                    name: name,
                    phone: phone,
                    whatsapp: whatsapp,
                    city: selectedCity,
                    area: area,
                    address: address,
                    landmark: landmark
                }
            };

            db.collection("orders").add(orderPayload)
            .then((docRef) => {
                // Clean short popup alert as requested
                alert("✅ Order Placed Successfully!");
                cart = [];
                updateCartUI();
                switchTab('home');
            })
            .catch((error) => {
                console.error("Error adding order: ", error);
                alert("Error placing order. Check console.");
            });
        }
    </script>
</body>
</html>
